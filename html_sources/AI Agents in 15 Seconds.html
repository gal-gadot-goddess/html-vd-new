<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Agents in 15 Seconds</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:#000;overflow:hidden;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:flex;align-items:center;justify-content:center}
#stage{height:100%;max-width:100%;aspect-ratio:9/16;background:radial-gradient(120% 70% at 50% 0%,#17153a 0%,#07070f 60%);position:relative}
svg{width:100%;height:100%;display:block}
.node{opacity:0;transform:scale(.92);transform-box:fill-box;transform-origin:center;transition:opacity .45s,transform .45s}
.node.on{opacity:1;transform:scale(1)}
.node rect{fill:rgba(255,255,255,.04);stroke:var(--c);stroke-width:2.5}
.node.on rect{fill:color-mix(in srgb,var(--c) 14%,transparent)}
.node.pulse rect{animation:pl .7s}
@keyframes pl{0%{filter:brightness(1)}40%{filter:brightness(2) drop-shadow(0 0 16px var(--c))}100%{filter:brightness(1)}}
.lab{fill:#fff;font-weight:800;font-size:25px;letter-spacing:1px}
.sub{fill:#9aa3b8;font-size:15px}
.ico{font-size:34px}
.conn{fill:none;stroke:#5b6488;stroke-width:3;stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.loop{stroke:#fbbf24}
.title{fill:url(#tg);font-weight:900;font-size:56px;letter-spacing:2px}
.subt{fill:#8b93a7;font-size:20px}
.cap{fill:#fff;font-size:22px;font-weight:700;opacity:0}
.cap.show{animation:up .45s forwards}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hdr{opacity:0;transition:opacity .6s}.hdr.on{opacity:1}
#rp{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:8px;background:#1b1d33;color:#cfd4ea;border:1px solid #333a62;border-radius:8px;padding:6px 10px;font-size:13px;opacity:.35;cursor:pointer}
#rp:hover{opacity:1}
</style>
</head>
<body>
<div id="stage">
<svg viewBox="0 0 540 960" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="tg" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
<filter id="gl" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<g class="hdr" id="hdr">
<text class="title" x="270" y="84" text-anchor="middle">AI AGENTS</text>
<text class="subt" x="270" y="118" text-anchor="middle">explained in 15 seconds</text>
</g>
<text class="cap" id="cap" x="270" y="170" text-anchor="middle"></text>
<g id="conns"></g>
<g id="nodes"></g>
<circle id="pk" r="9" fill="#fff" filter="url(#gl)" opacity="0"/>
</svg>
</div>
<button id="rp" onclick="start()">↻ replay</button>
<script>
const NS="http://www.w3.org/2000/svg";
const N=[
 {id:"goal",y:210,c:"#22d3ee",i:"🎯",l:"GOAL",s:"You ask for something"},
 {id:"think",y:360,c:"#a78bfa",i:"🧠",l:"THINK",s:"The LLM plans a step"},
 {id:"act",y:510,c:"#f472b6",i:"🛠️",l:"ACT",s:"Calls a tool or API"},
 {id:"obs",y:660,c:"#fbbf24",i:"👀",l:"OBSERVE",s:"Reads what came back"},
 {id:"done",y:810,c:"#4ade80",i:"✅",l:"DONE",s:"Returns the final answer"}
];
const $=id=>document.getElementById(id);
$("nodes").innerHTML=N.map(n=>`<g class="node" id="n_${n.id}" style="--c:${n.c}"><rect x="120" y="${n.y}" width="300" height="84" rx="18"/><text class="ico" x="152" y="${n.y+53}" text-anchor="middle">${n.i}</text><text class="lab" x="190" y="${n.y+37}">${n.l}</text><text class="sub" x="190" y="${n.y+62}">${n.s}</text></g>`).join("");
const P={c1:"M270 294V360",c2:"M270 444V510",c3:"M270 594V660",c4:"M270 744V810",loop:"M420 702C525 702 525 402 420 402"};
$("conns").innerHTML=Object.entries(P).map(([k,d])=>`<path class="conn ${k=="loop"?"loop":""}" id="${k}" d="${d}"/>`).join("");
const L={};
for(const k in P){const e=$(k),len=e.getTotalLength();L[k]=len;e.style.strokeDasharray=len;e.style.strokeDashoffset=len}
const on=id=>$(id).classList.add("on");
const draw=id=>$(id).style.strokeDashoffset=0;
const pulse=id=>{const e=$("n_"+id);e.classList.remove("pulse");void e.getBoundingClientRect();e.classList.add("pulse")};
const cap=t=>{const e=$("cap");e.classList.remove("show");void e.getBoundingClientRect();e.textContent=t;e.classList.add("show")};
const SEG=[[2.0,2.8,"c1"],[4.4,5.2,"c2"],[6.8,7.6,"c3"],[9.0,10.0,"loop"],[10.1,10.5,"c2"],[10.5,10.9,"c3"],[10.9,11.5,"loop"],[11.6,12.0,"c2"],[12.0,12.4,"c3"],[12.5,13.1,"c4"]];
const EV=[
 [0,()=>on("hdr")],
 [0.8,()=>{on("n_goal");cap("1. You give it a goal")}],
 [2.0,()=>draw("c1")],
 [2.8,()=>{on("n_think");pulse("think");cap("2. The LLM plans the next step")}],
 [4.4,()=>draw("c2")],
 [5.2,()=>{on("n_act");pulse("act");cap("3. It calls a tool: search, code, API")}],
 [6.8,()=>draw("c3")],
 [7.6,()=>{on("n_obs");pulse("obs");cap("4. It reads the result")}],
 [9.0,()=>{draw("loop");cap("5. Goal not met? Loop again")}],
 [10.0,()=>pulse("think")],
 [10.5,()=>pulse("act")],
 [10.9,()=>pulse("obs")],
 [11.5,()=>{pulse("think");cap("…until the job is done")}],
 [12.5,()=>draw("c4")],
 [13.1,()=>{on("n_done");pulse("done");cap("6. Goal met: answer delivered")}],
 [14.2,()=>cap("Follow for more AI in 15 seconds")]
];
const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
let t0,fired,raf;
function reset(){
 document.querySelectorAll(".on").forEach(e=>e.classList.remove("on"));
 document.querySelectorAll(".pulse").forEach(e=>e.classList.remove("pulse"));
 for(const k in P)$(k).style.strokeDashoffset=L[k];
 $("cap").classList.remove("show");$("cap").textContent="";$("pk").setAttribute("opacity",0);
 fired=EV.map(()=>false);
}
function start(){cancelAnimationFrame(raf);reset();t0=performance.now();raf=requestAnimationFrame(tick)}
function tick(now){
 const t=(now-t0)/1000;
 EV.forEach((e,i)=>{if(!fired[i]&&t>=e[0]){fired[i]=true;e[1]()}});
 const pk=$("pk");let vis=false;
 for(const [a,b,k] of SEG){
  if(t>=a&&t<=b){const p=$(k).getPointAtLength(ease((t-a)/(b-a))*L[k]);pk.setAttribute("cx",p.x);pk.setAttribute("cy",p.y);vis=true;break}
 }
 pk.setAttribute("opacity",vis?1:0);
 if(t>=16.5){start();return}
 raf=requestAnimationFrame(tick);
}
addEventListener("keydown",e=>{if(e.key==="r"||e.key==="R")start()});
start();
</script>
</body>
</html>
