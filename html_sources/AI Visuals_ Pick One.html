<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Visuals: Pick One</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:#000;overflow:hidden;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff}
#stage{position:absolute;left:50%;top:50%;width:540px;height:960px;transform-origin:center;background:#05050d;overflow:hidden}
canvas{position:absolute;inset:0;width:540px;height:960px}
#ov{position:absolute;left:0;right:0;top:0;bottom:0;text-align:center;pointer-events:none;transition:opacity .6s}
#kk{position:absolute;top:62px;left:0;right:0;font-size:14px;letter-spacing:5px;font-weight:800;color:#67e8f9}
#tt{position:absolute;top:88px;left:0;right:0;margin:0;font-size:46px;font-weight:900;letter-spacing:-.5px;line-height:1.05}
#cp{position:absolute;bottom:104px;left:44px;right:44px;margin:0;font-size:19px;line-height:1.4;color:#c9cee6;font-weight:500}
#dots{position:absolute;bottom:56px;left:0;right:0;display:flex;justify-content:center;gap:10px}
#dots i{width:26px;height:4px;border-radius:2px;background:rgba(255,255,255,.18)}
#dots i.on{background:#fff}
#bt{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:8px;z-index:9;display:flex;gap:4px}
#bt button{background:#1b1d33;color:#cfd4ea;border:1px solid #333a62;border-radius:8px;padding:6px 10px;font-size:13px;opacity:.4;cursor:pointer}
#bt button:hover,#bt button.on{opacity:1}
</style>
</head>
<body>
<div id="stage">
<canvas id="c" width="1080" height="1920"></canvas>
<div id="ov"><div id="kk"></div><h1 id="tt"></h1><p id="cp"></p><div id="dots"><i></i><i></i><i></i></div></div>
</div>
<div id="bt"><button data-m="0" class="on">ALL</button><button data-m="1">1</button><button data-m="2">2</button><button data-m="3">3</button></div>
<script>
const cv=document.getElementById("c"),ctx=cv.getContext("2d"),stage=document.getElementById("stage");
const INFO=[
 ["01 · NEURAL NETWORKS","How an AI thinks","Signals flow through layers of neurons until one answer lights up."],
 ["02 · TRAINING","How an AI learns","Gradient descent rolls downhill on the loss landscape to find the best weights."],
 ["03 · TRANSFORMERS","How an AI reads","Attention links every word to the words that give it meaning."]
];
const DUR=9;
function fit(){const s=Math.min(document.body.clientHeight/960,document.body.clientWidth/540);stage.style.transform="translate(-50%,-50%) scale("+s+")"}
addEventListener("resize",fit);fit();
const R=(a,b,c,d)=>{const x=Math.sin(a*127.1+b*311.7+c*74.7+d*19.3+1.7)*43758.5453;return x-Math.floor(x)};
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),lerp=(a,b,k)=>a+(b-a)*k,ease=x=>1-Math.pow(1-clamp(x,0,1),3);
function dot(x,y,r,h,a){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`hsla(${h},100%,78%,${a})`);g.addColorStop(.4,`hsla(${h},100%,60%,${a*.35})`);g.addColorStop(1,`hsla(${h},100%,50%,0)`);ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
const stars=Array.from({length:90},(_,i)=>({x:R(i,1,1,1)*540,y:R(i,2,2,2)*960,z:.2+R(i,3,3,3)}));
function bg(T){
 ctx.globalCompositeOperation="source-over";
 ctx.fillStyle="#05050d";ctx.fillRect(0,0,540,960);
 ctx.globalCompositeOperation="lighter";
 dot(270+Math.sin(T*.2)*140,260+Math.cos(T*.17)*60,420,255,.16);
 dot(270+Math.cos(T*.15)*160,720+Math.sin(T*.2)*60,420,200,.12);
 stars.forEach(s=>{s.y-=s.z*.12;if(s.y<0)s.y=960;ctx.fillStyle=`rgba(255,255,255,${.15+.35*s.z*(.6+.4*Math.sin(T*2+s.x))})`;ctx.fillRect(s.x,s.y,1.4*s.z+.4,1.4*s.z+.4)});
}
/* ---------- 1: neural network ---------- */
const NL=[4,6,6,3],NY=[310,445,580,715],NH=[190,225,268,325],OUT=["cat","dog","bird"];
const npos=(l,i)=>[270+(i-(NL[l]-1)/2)*72,NY[l]];
function s1(t,a){
 const P=2.25,w=Math.floor(t/P),u=t-w*P,win=Math.floor(R(w,9,9,9)*3);
 const act=(l,i)=>{const x=u-l*.5;if(x<0)return 0;const b=l==3?(i==win?1:.18):.3+.7*R(w,l,i,2);return b*Math.exp(-x*1.5)};
 for(let l=0;l<3;l++)for(let i=0;i<NL[l];i++)for(let j=0;j<NL[l+1];j++){
  const [x1,y1]=npos(l,i),[x2,y2]=npos(l+1,j),wt=R(w,l,i,j),af=act(l,i);
  ctx.strokeStyle=`hsla(${NH[l]},90%,65%,${(.06+.32*af*wt)*a})`;ctx.lineWidth=.8+af*wt*1.4;
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  const p=(u-l*.5)/.5;
  if(wt>.45&&p>0&&p<1){const e=ease(p);dot(lerp(x1,x2,e),lerp(y1,y2,e),10,NH[l],.9*wt*a)}
 }
 ctx.font="700 11px ui-sans-serif,system-ui";ctx.textAlign="left";
 ["INPUT","HIDDEN","HIDDEN","OUTPUT"].forEach((n,l)=>{ctx.fillStyle=`rgba(160,170,200,${.6*a})`;ctx.fillText(n,22,NY[l]+4)});
 for(let l=0;l<4;l++)for(let i=0;i<NL[l];i++){
  const [x,y]=npos(l,i),ac=act(l,i);
  dot(x,y,14+ac*34,NH[l],(.25+.75*ac)*a);
  ctx.fillStyle=`hsla(${NH[l]},100%,${55+ac*35}%,${a})`;ctx.beginPath();ctx.arc(x,y,6+ac*3,0,7);ctx.fill();
 }
 ctx.textAlign="center";
 for(let i=0;i<3;i++){const [x,y]=npos(3,i),on=i==win&&u>1.5;
  ctx.font=`${on?800:600} ${on?16:13}px ui-sans-serif,system-ui`;ctx.fillStyle=`rgba(255,255,255,${(on?1:.45)*a})`;
  ctx.fillText(on?`${OUT[i]} ${90+Math.floor(R(w,5,5,5)*9)}%`:OUT[i],x,y+38)}
}
/* ---------- 2: gradient descent ---------- */
const F=(x,z)=>.28*(x*x+z*z)+.2*Math.sin(2.2*x)*Math.cos(2.2*z)-.9*Math.exp(-((x-.7)**2+(z+.5)**2)/.45);
const path=(()=>{let x=-1.9,z=1.5,vx=0,vz=0;const p=[],h=1e-3;
 for(let i=0;i<300;i++){const gx=(F(x+h,z)-F(x-h,z))/2/h,gz=(F(x,z+h)-F(x,z-h))/2/h;vx=vx*.9-.07*gx;vz=vz*.9-.07*gz;x+=vx;z+=vz;p.push([x,z,F(x,z)])}return p})();
let ANG=0;const PI=.95;
function proj(x,y,z){const c=Math.cos(ANG),s=Math.sin(ANG),X=x*c+z*s,Z=-x*s+z*c,cp=Math.cos(PI),sp=Math.sin(PI),Y2=y*cp+Z*sp,Z2=6-y*sp+Z*cp,k=560/Z2;return[270+X*k,545-Y2*k,Z2]}
function s2(t,a){
 ANG=.5+t*.17;const N=22,S=30,E=2.3;
 ctx.lineWidth=.9;
 for(let d=0;d<2;d++)for(let i=0;i<N;i++){const c=-E+i*2*E/(N-1);let pv=null;
  for(let j=0;j<S;j++){const q=-E+j*2*E/(S-1),x=d?q:c,z=d?c:q,f=F(x,z),pt=proj(x,f*.9,z);
   if(pv){const hue=190+clamp((f+.9)/2.4,0,1)*130,al=clamp((9-pt[2])/4,.12,.75)*.75*a;
    ctx.strokeStyle=`hsla(${hue},95%,62%,${al})`;ctx.beginPath();ctx.moveTo(pv[0],pv[1]);ctx.lineTo(pt[0],pt[1]);ctx.stroke()}
   pv=pt}}
 const tt=clamp((t-.8)/6.6,0,1),idx=Math.floor(ease(tt)*(path.length-1));
 for(let i=Math.max(0,idx-70);i<idx;i++){const A=path[i],B=path[i+1],p1=proj(A[0],A[2]*.9+.04,A[1]),p2=proj(B[0],B[2]*.9+.04,B[1]);
  ctx.strokeStyle=`hsla(45,100%,70%,${(1-(idx-i)/70)*.9*a})`;ctx.lineWidth=2.6;ctx.beginPath();ctx.moveTo(p1[0],p1[1]);ctx.lineTo(p2[0],p2[1]);ctx.stroke()}
 const B=path[idx],bp=proj(B[0],B[2]*.9+.06,B[1]);
 dot(bp[0],bp[1],34+Math.sin(t*6)*4,45,a);ctx.fillStyle=`rgba(255,255,255,${a})`;ctx.beginPath();ctx.arc(bp[0],bp[1],5,0,7);ctx.fill();
 const loss=B[2]+.95,done=idx>=path.length-3;
 ctx.textAlign="left";ctx.font="700 13px ui-monospace,Menlo,Consolas,monospace";ctx.fillStyle=`rgba(200,210,235,${a})`;
 ctx.fillText(`step ${String(idx).padStart(3,"0")}`,40,812);ctx.fillText(`loss ${loss.toFixed(3)}`,40,832);
 ctx.fillStyle=`rgba(255,255,255,${.1*a})`;ctx.fillRect(200,814,300,8);
 ctx.fillStyle=`hsla(${done?140:45},100%,60%,${a})`;ctx.fillRect(200,814,300*clamp(1-loss/2.2,.02,1),8);
 if(done){ctx.textAlign="center";ctx.font="800 15px ui-sans-serif,system-ui";ctx.fillStyle=`rgba(110,255,170,${a})`;ctx.fillText("CONVERGED",350,806)}
}
/* ---------- 3: attention ---------- */
const TK=["The","cat","chased","the","mouse","because","it","squeaked"],TY=TK.map((_,i)=>270+i*66);
const ATT={6:{4:.62,1:.25,2:.08,7:.05},2:{1:.55,4:.35,3:.1},4:{3:.3,2:.45,1:.25},7:{6:.55,4:.35,5:.1}},ORD=[6,2,4,7];
const cw=new Array(8).fill(0);
function s3(t,a){
 const fi=t<.8?-1:Math.min(3,Math.floor((t-.8)/2)),fo=fi<0?-1:ORD[fi],tg=fo<0?{}:ATT[fo];
 for(let j=0;j<8;j++)cw[j]+=((tg[j]||0)-cw[j])*.08;
 ctx.globalCompositeOperation="lighter";
 if(fo>=0)for(let j=0;j<8;j++){const w=cw[j];if(w<.012)continue;
  const y1=TY[fo],y2=TY[j],bx=215+clamp(Math.abs(y2-y1)*.5,44,250),hue=180+j*22;
  for(const [lw,al] of [[2+w*22,.16],[1+w*9,.7]]){
   ctx.strokeStyle=`hsla(${hue},95%,65%,${al*(.35+w)*a})`;ctx.lineWidth=lw;ctx.lineCap="round";
   ctx.beginPath();ctx.moveTo(205,y1);ctx.bezierCurveTo(bx,y1,bx,y2,205,y2);ctx.stroke()}
  for(let k=0;k<2;k++){const u=(t*.55+k*.5+j*.13)%1,m=1-u,
   px=m*m*m*205+3*m*m*u*bx+3*m*u*u*bx+u*u*u*205,py=m*m*m*y2+3*m*m*u*y2+3*m*u*u*y1+u*u*u*y1;dot(px,py,10,hue,.9*Math.min(1,w*3)*a)}
  if(w>.15){ctx.textAlign="left";ctx.font="800 14px ui-sans-serif,system-ui";ctx.fillStyle=`rgba(255,255,255,${Math.min(1,w*2)*a})`;ctx.fillText(Math.round(w*100)+"%",(410+6*bx)/8+8,(y1+y2)/2+5)}
 }
 TK.forEach((s,j)=>{
  const e=j==fo?1:Math.min(1,cw[j]*2.5),hue=j==fo?48:180+j*22,y=TY[j];
  if(e>.05)dot(130,y,70,hue,.35*e*a);
  rr(55,y-21,150,42,14);ctx.fillStyle=`rgba(255,255,255,${.05*a})`;ctx.fill();
  ctx.strokeStyle=`hsla(${hue},90%,${55+e*20}%,${(.25+.75*e)*a})`;ctx.lineWidth=1.5+e;ctx.stroke();
  ctx.textAlign="center";ctx.font="800 19px ui-sans-serif,system-ui";ctx.fillStyle=`rgba(255,255,255,${(.55+.45*e)*a})`;ctx.fillText(s,130,y+7);
  if(j==fo){ctx.font="800 10px ui-sans-serif,system-ui";ctx.fillStyle=`hsla(48,100%,70%,${a})`;ctx.textAlign="left";ctx.fillText("QUERY",24,y+4)}
 });
}
/* ---------- loop ---------- */
const SC=[s1,s2,s3],ov=document.getElementById("ov"),dots=[...document.querySelectorAll("#dots i")];
let mode=0,T0=performance.now(),cur=-1;
function setInfo(i){const [k,t,c]=INFO[i];document.getElementById("kk").textContent=k;document.getElementById("tt").textContent=t;document.getElementById("cp").textContent=c;dots.forEach((d,j)=>d.classList.toggle("on",j==i))}
function frame(now){
 const T=(now-T0)/1000,idx=mode?mode-1:Math.floor(T/DUR)%3,t=T%DUR,a=clamp(Math.min(t/.7,(DUR-t)/.7),0,1);
 if(idx!==cur){cur=idx;setInfo(idx);ctx.save()}
 ov.style.opacity=a;
 ctx.setTransform(2,0,0,2,0,0);bg(T);ctx.globalCompositeOperation="lighter";ctx.lineCap="round";
 SC[idx](t,a);
 requestAnimationFrame(frame);
}
document.querySelectorAll("#bt button").forEach(b=>b.onclick=()=>{mode=+b.dataset.m;T0=performance.now();cur=-1;document.querySelectorAll("#bt button").forEach(x=>x.classList.toggle("on",x===b))});
addEventListener("keydown",e=>{if("0123".includes(e.key)){document.querySelector(`#bt button[data-m="${e.key}"]`).click()}});
requestAnimationFrame(frame);
</script>
</body>
</html>
